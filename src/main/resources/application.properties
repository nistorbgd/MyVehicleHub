spring.application.name=MyVehicleHub

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Refresh Token Configuration (in seconds)
# 90 days = 90 days * 24 hours * 60 minutes * 60 seconds = 7776000 seconds
# Note: Tokens are rotated on each use, so active users will never reach expiration
app.refresh-token.expiration=7776000

# JWT Configuration
# Generate a secure key with: openssl rand -base64 64
# 30 minutes
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000
